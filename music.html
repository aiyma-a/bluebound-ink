<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | Bluebound Ink</title>
    <!-- Link preview (Telegram, WhatsApp, Instagram, X, ...) -->
    <meta name="description" content="Monthly playlists and soundtracks.">
    <meta property="og:site_name" content="Bluebound Ink">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Music | Bluebound Ink">
    <meta property="og:description" content="Monthly playlists and soundtracks.">
    <meta property="og:url" content="https://bluebound-ink.com/music.html">
    <meta property="og:image" content="https://bluebound-ink.com/images/og-default.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Importing Cormorant Garamond from Google Fonts -->
     <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <style>

        .page-section-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
        }

        /* Now Playing Card Styling */
        .now-playing-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            max-width: 260px;
        }

        .vinyl-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .album-art-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-art-center img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .now-playing-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .track-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: inherit;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .artist-name {
            font-size: 0.7rem;
            color: var(--text-color);
            opacity: 0.6;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        /* Monthly Playlist Section Styles */
        .monthly-entry {
            margin-bottom: 50px;
        }

        .playlist-month-heading {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 15px;
            font-style: italic;
        }

        .playlist-wrapper {
            margin: 20px 0 40px 0;
        }

        .playlist-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            max-width: 100%;
            overflow: hidden;
        }

        .playlist-container:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
    <link rel="stylesheet" href="/design.css">
</head>
<body>

    <header id="site-header">
    </header>

    <main>
        <h2 class="page-section-title gold-accent">Music & Soundtracks</h2>
        
        <p class="music-coming-soon" style="margin-top: 20px; color: var(--text-muted, #9aa3b2); font-style: italic;">New playlists are coming soon.</p>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="/site.js"></script>
    
</body>
</html>
